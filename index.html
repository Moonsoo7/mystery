<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION
     mystery: a one-case English listening mystery. Detective Dalton helps Betty find her lost cat, Biscuit.
     Art, UI and fonts reused from the earlier detective game; new art (cat, clue room, found scene) and all voices made with Higgsfield. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mystery</title>
<style>
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy Display";src:url("assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400;font-display:swap}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--ink-soft:#7D6A58;--berry:#C96F86;--honey:#F2CF73;--moss:#5E8A63;--no:#C25B5B;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-body:"Paperlogy",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
img{user-select:none;-webkit-user-drag:none}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
@media (min-width:520px){body{align-items:center;padding-block:16px}.app{height:min(900px,calc(100% - 8px));border-radius:38px 42px 36px 44px/44px 36px 42px 38px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* buttons: the old game's crayon-paper buttons */
.pill{--btn:url(assets/ui/buttons/cream-flat.png);--bw:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:2px 12px;border:2px solid transparent;
  border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;background:none;font-family:var(--f-display);font-size:14px;color:var(--ink);transition:transform .1s}
.pill:active{transform:translateY(1px);filter:brightness(.94)}
.pill.sm{--bw:12px;min-height:30px;padding:0 10px;font-size:12px}
.pill.big{--btn:url(assets/ui/buttons/berry-flat.png);--bw:20px;min-height:52px;padding:4px 26px;font-size:17px;color:#fff}
.pill.green{--btn:url(assets/ui/buttons/sage-flat.png);color:#fff}
.pill.honey{--btn:url(assets/ui/buttons/honey-flat.png)}
.pill[aria-pressed="true"]{--btn:url(assets/ui/buttons/sky-flat.png)}
.pill:disabled{opacity:.45;cursor:default}
.play-btn{flex:none;width:34px;height:34px;padding:0;border:0;background:url(assets/ui/icons/play.png) 58% 50%/46% auto no-repeat,url(assets/ui/buttons/round-cream.png) center/100% no-repeat}
.play-btn.on{animation:pulse .9s ease-in-out infinite}
.close-button{width:42px;height:42px;padding:0;border:0;background:url(assets/ui/close-button.png) center/contain no-repeat;filter:drop-shadow(0 3px 0 rgba(74,54,40,.3))}
.top-back{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;width:42px;height:42px;padding:0;border:0;background:url(assets/ui/buttons/round-cream.png) center/100% no-repeat}
.top-back svg{width:22px;height:22px}

/* the speech bubble: paper frame with a pencil tail */
.say{position:relative;z-index:6;width:min(92%,390px);margin:0 auto;padding:22px 20px 14px;font-size:18px;line-height:1.42;filter:drop-shadow(2px 4px 2px rgba(52,32,17,.2));animation:pop .38s cubic-bezier(.3,1.45,.5,1) both}
.say::before{content:"";position:absolute;inset:0;z-index:-1;background:#FFF8E9;background-clip:padding-box;border:20px solid transparent;border-image:url(assets/ui/speech-paper-frame.png) 150 190 fill / 33px 42px / 0 stretch}
.say.tail::after{content:"";position:absolute;left:50%;bottom:-21px;width:48px;height:30px;transform:translateX(-50%);background:url(assets/ui/speech-paper-tail-pencil.png) center/contain no-repeat}
.say .who{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.say .who img{width:30px;height:30px;object-fit:contain}
.say .en{margin:0}
.say .en .w{border-radius:4px;transition:background .15s}
.say .en .w.lit{background:rgba(242,207,115,.75)}
.say .ko{margin:6px 0 0;font-size:15px;color:var(--ink-soft)}
.say .foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.say .foot .grow{flex:1}
.say .next{font-family:var(--f-display);font-size:13px;color:var(--berry);animation:bob 1s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes pulse{50%{transform:scale(1.12)}}

/* home: the detective's office */
#home{background:url(assets/places/detective-office-wide.jpg) 42% center/cover}
#home .plate{margin:calc(18px + env(safe-area-inset-top,0px)) auto 0;padding:8px 22px;border:12px solid transparent;border-image:url(assets/ui/casekey/card.webp) 20 fill / 12px stretch;font-family:var(--f-display);font-size:20px}
#home .say{margin-top:18px}
.det-stand{position:absolute;left:50%;bottom:86px;width:min(70%,300px);transform:translateX(-50%);transform-origin:50% 100%}
.det-stand.talk,.char.talk{animation:talk .5s ease-in-out infinite}
@keyframes talk{50%{transform:translateX(-50%) scaleY(1.025) translateY(-2px)}}
#betty2.talk{animation-name:talk2}
@keyframes talk2{50%{transform:scaleY(1.025) translateY(-2px)}}
.nav{position:relative;z-index:10;margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 10px calc(11px + env(safe-area-inset-bottom,0px));background:var(--paper-2)}
.nav .pill{--bw:20px;min-height:50px;font-size:15px}
.nav .pill img{width:28px;height:28px;object-fit:contain}

/* case list */
#cases{background:var(--paper)}
#cases h1{margin:calc(22px + env(safe-area-inset-top,0px)) 0 6px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:400}
#cases .sub{margin:0 0 10px;text-align:center;color:var(--ink-soft)}
.board{flex:1;overflow-y:auto;padding:12px 20px}
.case-card{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:14px;border:12px solid transparent;border-image:url(assets/ui/casekey/card.webp) 20 fill / 12px stretch;background:none;text-align:left;transform:rotate(-.8deg);filter:drop-shadow(2px 4px 4px rgba(70,50,30,.2))}
.case-card .pol{flex:none;width:96px;padding:6px 6px 16px;background:url(assets/ui/polaroid-card.webp) center/100% 100%;transform:rotate(3deg)}
.case-card .pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#E9DCC0}
.case-card .no{font-family:var(--f-display);font-size:13px;color:var(--berry)}
.case-card .t{margin:2px 0;font-family:var(--f-display);font-size:20px}
.case-card .tk{color:var(--ink-soft)}
.case-card .stamp{position:absolute;right:-6px;top:-16px;width:96px;transform:rotate(12deg)}
.tack{position:absolute;left:50%;top:-14px;width:26px;transform:translateX(-50%)}

/* talk scene */
#talk{background:#3b2a1f}
#talk .room{position:absolute;inset:0;background:url(assets/places/betty-home-higgsfield.png) 18% 100%/auto 100% no-repeat}
#talk .room::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(30,20,10,.25),rgba(30,20,10,0) 40%)}
.char{position:absolute;bottom:0;left:50%;height:58%;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));transition:opacity .3s}
#talk .bubble-slot{position:relative;z-index:6;margin-top:calc(62px + env(safe-area-inset-top,0px))}
.ask{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;gap:8px;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(251,244,230,.97) 70%,rgba(251,244,230,0))}
.ask .lead{margin:0 0 2px;text-align:center;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.ask .pill{justify-content:flex-start;text-align:left;min-height:50px;font-size:15px;line-height:1.25}
.ask .pill small{display:block;font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.tap-cue{position:absolute;inset:0;z-index:5}

/* investigation */
#inv{background:var(--paper)}
.inv-head{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 8px 62px;min-height:62px}
.inv-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:18px;font-weight:400}
.count{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:15px}
.count img{width:22px;height:22px;opacity:.25}
.count img.got{opacity:1}
.art-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:#2b1e15}
.art{position:relative;flex:none;height:var(--art-h,100%);aspect-ratio:1344/752}
.art>img{display:block;height:100%;width:100%}
.spot{position:absolute;border:0;background:none;padding:0;border-radius:50%}
.spot.got{border:4px solid rgba(201,111,134,.9);box-shadow:0 0 0 2px rgba(255,248,233,.6);border-radius:46% 54% 50% 50%/52% 46% 54% 48%}
.spot.got::after{content:"✓";position:absolute;right:-8px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--berry);color:#fff;font:700 17px/28px var(--f-body);text-align:center;pointer-events:none}
.spot.looked::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);background:url(assets/ui/crayon-x-1.png) center/contain no-repeat;opacity:.55;pointer-events:none}
.spot.hint{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(242,207,115,.8),0 0 28px 10px rgba(242,207,115,.6)}}
.ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:4px solid var(--honey);border-radius:50%;pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
.swipe-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 14px;border-radius:14px;background:rgba(74,54,40,.7);color:#fff;font-size:13px;white-space:nowrap;pointer-events:none;animation:fade 4s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
.inv-low{position:relative;flex:1 0 auto;min-height:212px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper-2)}
.inv-low .say{margin-top:4px}
.inv-low .go{display:flex;justify-content:center;margin-top:12px}
.inv-tip{margin:24px 24px 0;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.5}

/* deduction board */
#ded{background:url(assets/ui/corkboard-cork.webp) center/240px repeat}
#ded h2{margin:calc(14px + env(safe-area-inset-top,0px)) 0 0;padding-left:62px;min-height:48px;display:flex;align-items:center;font-family:var(--f-display);font-size:20px;font-weight:400;color:#fff;text-shadow:0 2px 0 rgba(74,54,40,.5)}
.steps{display:flex;gap:6px;justify-content:center;margin:4px 0 8px}
.steps i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid var(--ink)}
.steps i.done{background:var(--moss)}.steps i.now{background:var(--honey)}
.note{position:relative;width:min(88%,360px);margin:18px auto 0;padding:22px 18px 18px;border:11px solid transparent;border-image:url(assets/ui/casekey/note-yellow.webp) 22 fill / 11px stretch;transform:rotate(-.8deg);filter:drop-shadow(2px 5px 4px rgba(50,30,15,.3))}
.note .tape{position:absolute;left:50%;top:-22px;width:90px;transform:translateX(-50%) rotate(-3deg)}
.note .sent{margin:0;font-size:20px;line-height:1.5;text-align:center}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);color:var(--berry);font-family:var(--f-display)}
.note .sk{margin:6px 0 0;text-align:center;color:var(--ink-soft)}
.mark{position:absolute;right:-8px;top:-18px;width:64px;animation:pop .3s both}
.opts{display:flex;flex-direction:column;gap:10px;width:min(80%,320px);margin:18px auto 0}
.opts .pill{--bw:18px;min-height:52px;font-size:17px}
.opts .pill.ok{--btn:url(assets/ui/buttons/sage-flat.png);color:#fff}
.opts .pill.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ded .say{margin-top:8px}

/* finale */
#fin{background:#3b2a1f}
#fin .room{position:absolute;inset:0;background:url(assets/new/betty-home-clue.png) 14% 100%/auto 100% no-repeat}
#fin .basket-btn{position:absolute;z-index:4;border:0;background:none;border-radius:50%;animation:glow 1.2s ease-in-out infinite}
.found{position:absolute;left:50%;top:44%;z-index:7;width:min(84%,340px);padding:10px 10px 34px;background:url(assets/ui/polaroid-card.webp) center/100% 100%;transform:translate(-50%,-50%) rotate(-2deg);animation:drop .6s cubic-bezier(.3,1.4,.5,1) both;filter:drop-shadow(3px 8px 6px rgba(0,0,0,.35))}
.found img{display:block;width:100%}
@keyframes drop{from{transform:translate(-50%,-90%) rotate(-12deg);opacity:0}}
.done-stamp{position:absolute;right:8%;top:16%;z-index:9;width:min(46%,190px);animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:scale(2.6) rotate(-25deg);opacity:0}to{transform:rotate(-12deg);opacity:1}}
#fin .low{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:0 0 calc(14px + env(safe-area-inset-bottom,0px))}
#fin .go{display:flex;justify-content:center;margin-top:10px}
.cat-hop{position:absolute;z-index:8;width:110px;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-12px) rotate(4deg)}}

.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(74,54,40,.38)}
.mcard{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 18px 16px;background:var(--paper);border:3px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;box-shadow:5px 6px 0 rgba(74,54,40,.25);text-align:center}
.mcard p{margin:0;font-family:var(--f-display);font-size:17px}
.mcard .s{font-family:var(--f-body);font-size:14px;color:var(--ink-soft)}
.mcard .pill{width:100%}
#checkOut{position:fixed;left:0;bottom:0;z-index:99;margin:0;padding:4px;background:#fff;font:11px monospace}
</style>
</head>
<body>
<div class="app" id="app">
  <audio id="vo" preload="auto"></audio>

  <!-- HOME: the detective's office -->
  <section class="screen" id="home">
    <div class="plate">탐정 사무소</div>
    <div class="bubble-slot" id="homeSay"></div>
    <img class="det-stand" id="homeDet" src="assets/characters/detective-wave.png" alt="탐정 달튼">
    <nav class="nav">
      <button class="pill" type="button" id="navHome" aria-pressed="true"><img src="assets/ui/nav/home-house.png" alt="">홈</button>
      <button class="pill" type="button" id="navCases"><img src="assets/ui/nav/case-magnifier.png" alt="">사건</button>
    </nav>
  </section>

  <!-- CASE LIST: one case -->
  <section class="screen" id="cases" hidden>
    <h1>사건 목록</h1>
    <p class="sub">해결할 사건을 골라 주세요</p>
    <div class="board">
      <button class="case-card" type="button" id="case1">
        <img class="tack" src="assets/ui/tack-red.webp" alt="">
        <span class="pol"><img src="assets/new/biscuit.png" alt=""></span>
        <span><span class="no">CASE 1</span><span class="t" style="display:block">The Missing Cat</span><span class="tk">사라진 고양이 비스킷</span></span>
        <img class="stamp" id="case1Stamp" src="assets/ui/complete-stamp.png" alt="해결" hidden>
      </button>
    </div>
    <nav class="nav">
      <button class="pill" type="button" id="navHome2"><img src="assets/ui/nav/home-house.png" alt="">홈</button>
      <button class="pill" type="button" aria-pressed="true"><img src="assets/ui/nav/case-magnifier.png" alt="">사건</button>
    </nav>
  </section>

  <!-- TALK: Betty, one question -->
  <section class="screen" id="talk" hidden>
    <div class="room"></div>
    <img class="char" id="betty" src="assets/characters/betty-higgsfield.png" alt="베티">
    <div class="tap-cue" id="tapCue"></div>
    <div class="bubble-slot" id="talkSay"></div>
    <div class="ask" id="ask" hidden></div>
  </section>

  <!-- INVESTIGATION: Betty's house -->
  <section class="screen" id="inv" hidden>
    <div class="inv-head"><h2>베티의 집</h2><span class="count" id="count"></span></div>
    <div class="art-wrap" id="artWrap"><div class="art" id="art"><img src="assets/new/betty-home-clue.png" alt="베티의 집"></div></div>
    <div class="inv-low" id="invLow"></div>
  </section>

  <!-- DEDUCTION -->
  <section class="screen" id="ded" hidden>
    <h2>Deduction · 추리하기</h2>
    <div class="steps" id="steps"></div>
    <div class="bubble-slot" id="dedSay"></div>
    <div class="note" id="note"><img class="tape" src="assets/ui/casekey/tape.webp" alt=""><p class="sent" id="sent"></p><p class="sk" id="sentKo" hidden></p></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- FINALE -->
  <section class="screen" id="fin" hidden>
    <div class="room"></div>
    <img class="char" id="betty2" src="assets/characters/betty-higgsfield.png" alt="베티" style="left:auto;right:-14%;height:42%;transform:none">
    <button class="basket-btn" id="basketBtn" type="button" aria-label="소풍 바구니 열기"></button>
    <div class="low"><div class="bubble-slot" id="finSay"></div><div class="go" id="finGo" hidden><button class="pill big" type="button" id="toOffice">사무소로 돌아가기</button></div></div>
  </section>

  <button class="top-back" type="button" id="back" aria-label="뒤로" hidden><svg viewBox="0 0 24 24"><path d="M14.5 5.5 L8 12 L14.5 18.5" fill="none" stroke="#4A3628" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div class="modal" id="leave" hidden><div class="mcard" role="alertdialog">
    <p>사건 목록으로 나갈까요?</p><p class="s">다시 들어오면 사건을 처음부터 시작해요.</p>
    <button class="pill big green" type="button" id="leaveStay">계속 조사하기</button>
    <button class="pill sm" type="button" id="leaveGo">사건 목록으로</button>
  </div></div>
</div>

<script src="config.js"></script>
<script src="tune.js"></script>
<script>
/* PROTOTYPE - NOT FOR PRODUCTION */
(function(){
'use strict';
var tune=new Proxy({},{get:function(_,k){var c=window.CONFIG[k];return c?c.value:undefined}});
var $=function(id){return document.getElementById(id)};
var SAVE='mystery.v1',save={solved:false};
try{save=Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){}
function store(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}}

/* ---------- the script: every line has its American-English voice file and a Korean translation ---------- */
var D={name:'Dalton',icon:'assets/ui/icons-v2/detective.png'},B={name:'Betty',icon:'assets/characters/betty-higgsfield.png'};
var L={
  o1:[D,"Hello! I'm Dalton, the detective of Acorn Hollow.",'안녕! 나는 도토리 마을의 탐정, 달튼이야.'],
  o2:[D,"Someone needs our help today. Let's check the case list.",'오늘 누군가 우리의 도움이 필요해. 사건 목록을 확인해 보자.'],
  o3:[D,'Great job! We found Biscuit together.','잘했어! 우리가 함께 비스킷을 찾았어.'],
  c1:[B,'Detective Dalton! My cat, Biscuit, is missing!','달튼 탐정님! 우리 고양이 비스킷이 사라졌어요!'],
  c2:[D,"Don't worry, Betty. I'll find her.",'걱정 마세요, 베티. 제가 찾아 드릴게요.'],
  c3:[D,'I can ask Betty only one question. What should I ask?','베티에게는 질문을 딱 한 번만 할 수 있어. 무엇을 물어볼까?'],
  q1:[D,'When did you last see Biscuit?','비스킷을 마지막으로 본 게 언제예요?'],

    if(!okv){ro.textContent='run-check failed at step '+i;return}i++;setTimeout(next,1200)})()}
if(/[?&]check=flow/.test(qs)){var at=(/[?&]at=(\w+)/.exec(qs)||[0,'home'])[1],out=document.createElement('pre');out.id='checkOut';started=true;showKo=/ko=1/.test(qs);
  try{st={asked:null,found:{},looked:{},step:0,lastFind:Date.now()};
    if(at==='home')goHome(false);if(at==='cases')goCases();
    if(at==='talk'){show('talk');bubble($('talkSay'),'c1',{tail:true,next:function(){}})}
    if(at==='ask'){show('talk');bubble($('talkSay'),'c3',{tail:true});askQuestion()}
    if(at==='inv'){goInvestigate();if(/found=1/.test(qs)){look(SPOTS[1],document.querySelector('.spot[data-k=yarn]'),{clientX:0,clientY:0});look(SPOTS[0],document.querySelector('.spot[data-k=win]'),{clientX:0,clientY:0})}}
    if(at==='ded'){goDeduce();var n=+(/step=(\d)/.exec(qs)||[0,0])[1];st.step=n;askDeduce();if(/answer=1/.test(qs))[].filter.call($('opts').children,function(b){return b.textContent===DQ[n].ok})[0].click()}
    if(at==='fin'){goFinale();if(/open=1/.test(qs))setTimeout(function(){$('basketBtn').onclick()},100)}
    var miss=[];Object.keys(L).forEach(function(k){var a=new Audio();a.preload='metadata';a.onerror=function(){miss.push(k);out.textContent='flow-check at='+at+' lines='+Object.keys(L).length+' missing-voice='+miss.join(',')};a.src='voice/'+k+'.mp3'});
    out.textContent='flow-check at='+at+' lines='+Object.keys(L).length+' errors=0'}
  catch(err){out.textContent='flow-check at='+at+' errors=1 '+err.message}
  document.body.appendChild(out)}
})();
